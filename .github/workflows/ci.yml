name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  OUR_DAYS_ENVIRONMENT: local
  OUR_DAYS_RESOURCE_MODE: detached

jobs:
  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Audit the complete dependency tree
        run: |
          set +e
          output=""
          status=1
          transient=1
          for attempt in 1 2 3 4; do
            output="$(timeout 90 npm audit --audit-level=moderate 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$output" | grep -Eq 'found [1-9][0-9]* vulnerabilit'; then
              exit "$status"
            fi
            if [ "$status" -ne 124 ] &&
              ! printf '%s\n' "$output" | grep -Eqi '503|Service Unavailable|audit endpoint returned an error'; then
              transient=0
            fi
            echo "npm audit attempt ${attempt} failed with status ${status}; retrying"
            sleep $((attempt * 10))
          done
          if [ "$transient" -eq 1 ]; then
            echo "::warning::npm audit registry was unavailable after retries; no vulnerability report was produced"
            exit 0
          fi
          exit "$status"
      - name: Run formatting, lint, type, and component checks
        run: npm run check
      - name: Build and scan with the default production bundler
        run: npm run build

  browser:
    name: Functional browsers
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install pinned browser engines and system libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build and scan the production application
        run: npm run build
      - name: Run Chromium, Firefox, and WebKit functional checks
        run: npx playwright test --grep-invert @visual
      - name: Run the no-Docker local journal flow
        run: npx playwright test -c playwright.local-journal.config.ts

  database:
    name: Local Supabase authorization
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Optional extra gate. The merge path is quality + browser, which do
    # not start Docker Desktop or the multi-container studio stack.
    continue-on-error: true
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install pinned Chromium, Firefox, WebKit, and system libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start the isolated local Supabase stack
        run: npm run supabase:start
      - name: Prove migrations and seeds reset reproducibly
        run: npm run db:reset && npm run db:reset
      - name: Run catalog, RLS, and authorization tests
        run: npm run test:db
      - name: Run real local Auth, OTP, invite, and revocation flow
        run: npm run test:auth:integration
      - name: Run new, existing, and reinvited target-bound invitation flows
        run: npm run test:invitation:integration
      - name: Run quarantined intake and immutable photo promotion
        run: npm run test:photo:integration
      - name: Race photo claims, uploads, and authority loss
        run: npm run test:photo:concurrency
      - name: Race organizer revocations and same-revision moment edits
        run: npm run test:db:concurrency
      - name: Detect generated database type drift
        run: npm run types:db:check
      - name: Prove the checked local logical database recovery contract
        run: npm run test:db:restore
      - name: Build, scan, and run connected production browser flows
        run: npm run test:browser:connected:all
      - name: Lint database functions and schemas
        run: npm run db:lint
      - name: Stop only the Our Days local stack
        if: always()
        run: npm run supabase:stop

  visual:
    name: Intel macOS visual baselines
    needs: quality
    runs-on: macos-15-intel
    timeout-minutes: 25
    # First hosted Intel run is a calibration gate. Journal pixels are not
    # rewritten from Linux; reviewed darwin snapshots replace these later.
    continue-on-error: true
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install the pinned Chromium build
        run: npx playwright install chromium
      - name: Build and scan the production application
        run: npm run build
      - name: Compare approved Intel macOS visual baselines
        run: >-
          npx playwright test tests/e2e/visual.spec.ts
          --project=chromium-mobile
          --project=chromium-short
          --project=chromium-wide-visual
