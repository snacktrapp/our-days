name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  OUR_DAYS_ENVIRONMENT: local
  OUR_DAYS_RESOURCE_MODE: detached

jobs:
  changes:
    name: Specialist test scope
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.scope.outputs.database }}
      visual: ${{ steps.scope.outputs.visual }}
    steps:
      - name: Check out history for path classification
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify database and visual changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          database=false
          visual=false

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            database=true
            visual=true
          else
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
            fi

            while IFS= read -r file; do
              case "$file" in
                package.json|package-lock.json|supabase/*|src/app/api/*|src/lib/auth/*|src/lib/supabase/*|scripts/test-auth-*|scripts/test-database-*|scripts/test-db-*|scripts/test-invitation-*|scripts/test-photo-*)
                  database=true
                  ;;
              esac
              case "$file" in
                public/*|src/*.css|src/*.tsx|src/fixtures/*|tests/e2e/visual.spec.ts|tests/e2e/visual.spec.ts-snapshots/*)
                  visual=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "visual=$visual" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Audit the complete dependency tree
        run: |
          set +e
          output=""
          status=1
          transient=1
          for attempt in 1 2 3 4; do
            output="$(timeout 90 npm audit --audit-level=moderate 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if printf '%s\n' "$output" | grep -Eq 'found [1-9][0-9]* vulnerabilit'; then
              exit "$status"
            fi
            if [ "$status" -ne 124 ] &&
              ! printf '%s\n' "$output" | grep -Eqi '503|Service Unavailable|audit endpoint returned an error'; then
              transient=0
            fi
            echo "npm audit attempt ${attempt} failed with status ${status}; retrying"
            sleep $((attempt * 10))
          done
          if [ "$transient" -eq 1 ]; then
            echo "::warning::npm audit registry was unavailable after retries; no vulnerability report was produced"
            exit 0
          fi
          exit "$status"
      - name: Run formatting, lint, type, and component checks
        run: npm run check
      - name: Build and scan with the default production bundler
        run: npm run build
      - name: Install the pinned Chromium smoke-test browser
        run: npx playwright install --with-deps chromium
      - name: Prove Family paints after sign-in
        run: >-
          npx playwright test -c playwright.local-journal.config.ts
          --grep "cold open paints usable Family content after sign-in"

  exhaustive-browser:
    name: Nightly full Chromium (${{ matrix.project }})
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, chromium-short]
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install pinned Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Build and scan the production application
        run: npm run build
      - name: Run the full Chromium functional suite
        run: >-
          npx playwright test --grep-invert @visual
          --project=${{ matrix.project }}

  browser-smoke:
    name: Critical ${{ matrix.label }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium
            engine: chromium
            project: chromium-mobile
          - label: Firefox
            engine: firefox
            project: firefox-mobile
          - label: WebKit
            engine: webkit
            project: webkit-mobile
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install the pinned browser engine and system libraries
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Build and scan the production application
        run: npm run build
      - name: Run critical cross-browser flows
        run: >-
          npx playwright test --grep @critical
          --project=${{ matrix.project }}

  local-journal:
    name: Local journal browser flow
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825a76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install pinned Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Build and scan the production application
        run: npm run build
      - name: Run the no-Docker local journal flow
        run: npx playwright test -c playwright.local-journal.config.ts

  database:
    name: Local Supabase authorization
    needs: [quality, changes]
    if: >-
      needs.quality.result == 'success' &&
      needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Optional, path-gated PR signal plus a complete nightly/manual run.
    continue-on-error: true
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install pinned Chromium, Firefox, WebKit, and system libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start the isolated local Supabase stack
        run: npm run supabase:start
      - name: Prove migrations and seeds reset reproducibly
        run: npm run db:reset && npm run db:reset
      - name: Run catalog, RLS, and authorization tests
        run: npm run test:db
      - name: Run real local Auth, OTP, invite, and revocation flow
        run: npm run test:auth:integration
      - name: Run new, existing, and reinvited target-bound invitation flows
        run: npm run test:invitation:integration
      - name: Run quarantined intake and immutable photo promotion
        run: npm run test:photo:integration
      - name: Race photo claims, uploads, and authority loss
        run: npm run test:photo:concurrency
      - name: Race organizer revocations and same-revision moment edits
        run: npm run test:db:concurrency
      - name: Detect generated database type drift
        run: npm run types:db:check
      - name: Prove the checked local logical database recovery contract
        run: npm run test:db:restore
      - name: Build, scan, and run connected production browser flows
        run: npm run test:browser:connected:all
      - name: Lint database functions and schemas
        run: npm run db:lint
      - name: Stop only the Our Days local stack
        if: always()
        run: npm run supabase:stop

  visual:
    name: Intel macOS visual baselines
    needs: [quality, changes]
    if: >-
      needs.quality.result == 'success' &&
      needs.changes.outputs.visual == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 25
    # Path-gated PR signal plus a complete nightly/manual calibration run.
    continue-on-error: true
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install the pinned Chromium build
        run: npx playwright install chromium
      - name: Build and scan the production application
        run: npm run build
      - name: Compare approved Intel macOS visual baselines
        run: >-
          npx playwright test tests/e2e/visual.spec.ts
          --project=chromium-mobile
          --project=chromium-short
          --project=chromium-wide-visual

  pr-gate:
    name: PR Gate
    if: always()
    needs: [quality, browser-smoke, local-journal]
    runs-on: ubuntu-latest
    steps:
      - name: Require every merge-path job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_SMOKE_RESULT: ${{ needs['browser-smoke'].result }}
          LOCAL_JOURNAL_RESULT: ${{ needs['local-journal'].result }}
        run: |
          for result in \
            "$QUALITY_RESULT" \
            "$BROWSER_SMOKE_RESULT" \
            "$LOCAL_JOURNAL_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required merge-path job finished as $result"
              exit 1
            fi
          done
