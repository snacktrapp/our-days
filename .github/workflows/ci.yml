name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  OUR_DAYS_ENVIRONMENT: local
  OUR_DAYS_RESOURCE_MODE: detached

jobs:
  changes:
    name: Specialist test scope
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.scope.outputs.database }}
      visual: ${{ steps.scope.outputs.visual }}
    steps:
      - name: Check out history for path classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify database and visual changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          database=false
          visual=false

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            database=true
            visual=true
          else
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-parse "$HEAD_SHA^")"
            fi

            diff_range="$BASE_SHA..$HEAD_SHA"
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              diff_range="$BASE_SHA...$HEAD_SHA"
            fi

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/ci.yml|package.json|package-lock.json|playwright*.config.ts|supabase/*|src/app/api/*|src/lib/auth/*|src/lib/supabase/*|scripts/test-auth-*|scripts/test-database-*|scripts/test-db-*|scripts/test-invitation-*|scripts/test-photo-*|tests/integration/*)
                  database=true
                  ;;
              esac
              case "$file" in
                .github/workflows/ci.yml|playwright.config.ts|public/*|src/*.css|src/*.tsx|src/fixtures/*|tests/e2e/visual.spec.ts|tests/e2e/visual.spec.ts-snapshots/*)
                  visual=true
                  ;;
              esac
            done < <(git diff --name-only "$diff_range")
          fi

          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "visual=$visual" >> "$GITHUB_OUTPUT"

  quality:
    name: Quality and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Audit the complete dependency tree
        run: |
          set +e
          # Intentional exception: GHSA-vfj7-8cjw-p6xm alone must not fail this gate.
          # braces is dev-only via eslint-config-next → @next/eslint-plugin-next →
          # fast-glob → micromatch. Any other moderate-or-higher advisory still fails.
          status=1
          transient=1
          for attempt in 1 2 3 4; do
            json_file="$(mktemp)"
            err_file="$(mktemp)"
            timeout 90 npm audit --json --audit-level=moderate >"$json_file" 2>"$err_file"
            status=$?
            cat "$err_file"
            cat "$json_file"
            if [ "$status" -eq 0 ]; then
              rm -f "$json_file" "$err_file"
              exit 0
            fi
            AUDIT_JSON="$json_file" node <<'EOF'
            const fs = require("fs");

            // Intentional exception: GHSA-vfj7-8cjw-p6xm only.
            const ALLOWED = new Set(["ghsa-vfj7-8cjw-p6xm"]);
            const GHSA = /GHSA-[0-9a-z]{4}-[0-9a-z]{4}-[0-9a-z]{4}/i;

            function advisoryId(via) {
              for (const field of [via.url, via.source, via.name]) {
                if (typeof field !== "string") continue;
                const match = field.match(GHSA);
                if (match) return match[0].toLowerCase();
              }
              return null;
            }

            function isBlockingSeverity(severity) {
              const value = String(severity || "").toLowerCase();
              return value === "moderate" || value === "high" || value === "critical";
            }

            function isKnownNonBlocking(severity) {
              const value = String(severity || "").toLowerCase();
              return value === "info" || value === "low";
            }

            let report;
            try {
              report = JSON.parse(fs.readFileSync(process.env.AUDIT_JSON, "utf8"));
            } catch (error) {
              console.error(`npm audit did not produce JSON: ${error.message}`);
              process.exit(2);
            }

            if (
              !report ||
              typeof report !== "object" ||
              !report.vulnerabilities ||
              typeof report.vulnerabilities !== "object" ||
              Array.isArray(report.vulnerabilities) ||
              !report.metadata ||
              !report.metadata.vulnerabilities
            ) {
              console.error("npm audit JSON is not a vulnerability report");
              process.exit(2);
            }

            const vulns = report.vulnerabilities;
            const meta = report.metadata.vulnerabilities;
            const metaBlocking =
              Number(meta.moderate || 0) +
              Number(meta.high || 0) +
              Number(meta.critical || 0);
            const blockingNames = Object.keys(vulns).filter((name) =>
              isBlockingSeverity(vulns[name] && vulns[name].severity),
            );

            if (metaBlocking > blockingNames.length) {
              console.error(
                `::error::Audit metadata reports ${metaBlocking} moderate-or-higher findings, but only ${blockingNames.length} were readable`,
              );
              process.exit(1);
            }

            const memo = new Map();

            function explain(name, stack) {
              if (memo.has(name)) return memo.get(name);
              if (stack.has(name)) {
                return {
                  ok: false,
                  allowed: false,
                  reason: `dependency cycle at ${name}`,
                };
              }
              const vuln = vulns[name];
              if (!vuln) {
                return {
                  ok: false,
                  allowed: false,
                  reason: `missing vulnerability entry for ${name}`,
                };
              }
              if (!isBlockingSeverity(vuln.severity)) {
                const result = {
                  ok: true,
                  allowed: false,
                  reason: `${name} is below moderate`,
                };
                memo.set(name, result);
                return result;
              }

              const vias = Array.isArray(vuln.via) ? vuln.via : [];
              if (vias.length === 0) {
                const result = {
                  ok: false,
                  allowed: false,
                  reason: `${name} is ${vuln.severity} with no advisory source`,
                };
                memo.set(name, result);
                return result;
              }

              let allowed = false;
              for (const via of vias) {
                if (via && typeof via === "object") {
                  const id = advisoryId(via);
                  if (id && ALLOWED.has(id)) {
                    allowed = true;
                    continue;
                  }
                  if (isKnownNonBlocking(via.severity)) continue;
                  const label = id || via.title || "unidentified advisory";
                  const result = {
                    ok: false,
                    allowed: false,
                    reason: `${name} has ${via.severity || vuln.severity} advisory ${label}`,
                  };
                  memo.set(name, result);
                  return result;
                }
                if (typeof via === "string") {
                  stack.add(name);
                  const child = explain(via, stack);
                  stack.delete(name);
                  if (!child.ok) {
                    const result = {
                      ok: false,
                      allowed: false,
                      reason: `${name} → ${child.reason}`,
                    };
                    memo.set(name, result);
                    return result;
                  }
                  if (child.allowed) allowed = true;
                  continue;
                }
                const result = {
                  ok: false,
                  allowed: false,
                  reason: `${name} has an unreadable advisory source`,
                };
                memo.set(name, result);
                return result;
              }

              if (!allowed) {
                const result = {
                  ok: false,
                  allowed: false,
                  reason: `${name} is ${vuln.severity} without the allowlisted advisory`,
                };
                memo.set(name, result);
                return result;
              }

              const result = {
                ok: true,
                allowed: true,
                reason: `${name} is only GHSA-vfj7-8cjw-p6xm`,
              };
              memo.set(name, result);
              return result;
            }

            const failures = [];
            for (const name of blockingNames) {
              const result = explain(name, new Set());
              if (!result.ok) failures.push(result.reason);
            }

            if (failures.length > 0) {
              for (const failure of failures) console.error(`::error::${failure}`);
              process.exit(1);
            }

            console.log(
              `audit-allowlist: no blocking advisories. Intentional exception GHSA-vfj7-8cjw-p6xm covers ${blockingNames.length} moderate-or-higher finding(s).`,
            );
            process.exit(0);
          EOF
            decision=$?
            output="$(cat "$err_file"; printf '\n'; cat "$json_file")"
            rm -f "$json_file" "$err_file"
            if [ "$decision" -eq 0 ]; then
              exit 0
            fi
            if [ "$decision" -eq 1 ]; then
              exit 1
            fi
            if printf '%s\n' "$output" | grep -Eq 'found [1-9][0-9]* vulnerabilit'; then
              exit "$status"
            fi
            if [ "$status" -ne 124 ] &&
              ! printf '%s\n' "$output" | grep -Eqi '503|Service Unavailable|audit endpoint returned an error'; then
              transient=0
            fi
            echo "npm audit attempt ${attempt} failed with status ${status}; retrying"
            sleep $((attempt * 10))
          done
          if [ "$transient" -eq 1 ]; then
            echo "::warning::npm audit registry was unavailable after retries; no vulnerability report was produced"
            exit 0
          fi
          exit "$status"
      - name: Run formatting, lint, type, and component checks
        run: npm run check
      - name: Build and scan with the default production bundler
        run: npm run build
      - name: Install the pinned Chromium smoke-test browser
        run: npx playwright install --with-deps chromium
      - name: Prove Family paints after sign-in
        run: >-
          npx playwright test -c playwright.local-journal.config.ts
          --grep "cold open paints usable Family content after sign-in"

  exhaustive-browser:
    name: Nightly full Chromium (${{ matrix.project }})
    needs: quality
    if: >-
      needs.quality.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, chromium-short]
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install pinned Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Build and scan the production application
        run: npm run build
      - name: Run the full Chromium functional suite
        run: >-
          npx playwright test --grep-invert @visual
          --project=${{ matrix.project }}

  browser-smoke:
    name: Critical ${{ matrix.label }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium
            engine: chromium
            project: chromium-mobile
          - label: Firefox
            engine: firefox
            project: firefox-mobile
          - label: WebKit
            engine: webkit
            project: webkit-mobile
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install the pinned browser engine and system libraries
        run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Build and scan the production application
        run: npm run build
      - name: Run critical cross-browser flows
        run: >-
          npx playwright test --grep @critical
          --project=${{ matrix.project }}

  local-journal:
    name: Local journal browser flow
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install pinned Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Build and scan the production application
        run: npm run build
      - name: Run the no-Docker local journal flow
        run: npx playwright test -c playwright.local-journal.config.ts

  database:
    name: Local Supabase authorization
    needs: [quality, changes]
    if: >-
      needs.quality.result == 'success' &&
      needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Optional, path-gated PR signal plus a complete nightly/manual run.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install pinned Chromium, Firefox, WebKit, and system libraries
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start the isolated local Supabase stack
        run: npm run supabase:start
      - name: Prove migrations and seeds reset reproducibly
        run: npm run db:reset && npm run db:reset
      - name: Run catalog, RLS, and authorization tests
        run: npm run test:db
      - name: Run real local Auth, OTP, invite, and revocation flow
        run: npm run test:auth:integration
      - name: Run new, existing, and reinvited target-bound invitation flows
        run: npm run test:invitation:integration
      - name: Run quarantined intake and immutable photo promotion
        run: npm run test:photo:integration
      - name: Race photo claims, uploads, and authority loss
        run: npm run test:photo:concurrency
      - name: Race organizer revocations and same-revision moment edits
        run: npm run test:db:concurrency
      - name: Detect generated database type drift
        run: npm run types:db:check
      - name: Prove the checked local logical database recovery contract
        run: npm run test:db:restore
      - name: Build, scan, and run connected production browser flows
        run: npm run test:browser:connected:all
      - name: Lint database functions and schemas
        run: npm run db:lint
      - name: Stop only the Our Days local stack
        if: always()
        run: npm run supabase:stop

  visual:
    name: Intel macOS visual baselines
    needs: [quality, changes]
    if: >-
      needs.quality.result == 'success' &&
      needs.changes.outputs.visual == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 25
    # Path-gated PR signal plus a complete nightly/manual calibration run.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install the exact dependency tree
        run: npm ci
      - name: Install the pinned Chromium build
        run: npx playwright install chromium
      - name: Build and scan the production application
        run: npm run build
      - name: Compare approved Intel macOS visual baselines
        run: >-
          npx playwright test tests/e2e/visual.spec.ts
          --project=chromium-mobile
          --project=chromium-short
          --project=chromium-wide-visual

  pr-gate:
    name: PR Gate
    if: ${{ !cancelled() }}
    needs: [changes, quality, browser-smoke, local-journal]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every merge-path job
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_SMOKE_RESULT: ${{ needs['browser-smoke'].result }}
          LOCAL_JOURNAL_RESULT: ${{ needs['local-journal'].result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$QUALITY_RESULT" \
            "$BROWSER_SMOKE_RESULT" \
            "$LOCAL_JOURNAL_RESULT"
          do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required merge-path job finished as $result"
              exit 1
            fi
          done
