<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your Our Days invitation code</title>
  </head>
  <body style="margin: 0; background: #f3eee4; color: #2d2924">
    <div
      style="
        margin: 0 auto;
        max-width: 520px;
        padding: 40px 24px;
        font-family:
          -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;
      "
    >
      <p style="margin: 0 0 10px; color: #526047; font-size: 12px">
        Private family journal
      </p>
      <h1
        style="
          margin: 0;
          font-family: Georgia, serif;
          font-size: 28px;
          font-weight: 500;
        "
      >
        You have been invited to Our Days
      </h1>
      <p style="margin: 24px 0 10px; font-size: 15px; line-height: 1.5">
        Enter this one-time code to confirm that this email address belongs to
        you. It expires in ten minutes.
      </p>
      <p
        style="
          margin: 0;
          color: #315f63;
          font-family: ui-monospace, monospace;
          font-size: 30px;
          font-weight: 700;
          letter-spacing: 0.18em;
        "
      >
        {{ .Token }}
      </p>
      <p style="margin: 28px 0 0; color: #62594f; font-size: 13px">
        If you were not expecting this invitation, you can ignore this email.
      </p>
    </div>
  </body>
</html>
